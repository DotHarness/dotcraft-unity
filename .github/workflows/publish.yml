name: Publish Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Test MCP Gateway
      run: dotnet test "Tools~/McpGateway/tests/DotCraft.Unity.McpGateway.Tests.csproj" -c Release

    - name: Publish MCP Gateway
      run: >-
        dotnet publish "Tools~/McpGateway/src/DotCraft.Unity.McpGateway.csproj"
        -c Release -r win-x64 --self-contained true
        -p:PublishSingleFile=true -p:PublishTrimmed=false
        -o artifacts/gateway

    - name: Prepare Gateway release assets
      shell: pwsh
      run: |
        $package = Get-Content package.json -Raw | ConvertFrom-Json
        $executable = 'artifacts/gateway/dotcraft-unity-mcp.exe'
        $version = (& $executable version --json | ConvertFrom-Json)
        if ($version.version -ne $package.version) { throw 'Gateway version does not match package.json.' }
        if ($version.rid -ne 'win-x64') { throw 'Gateway reports an unexpected RID.' }
        if ($version.mcpSdkVersion -ne '2.2.0') { throw 'Gateway reports an unexpected MCP SDK version.' }

        $manifest = [ordered]@{
          version = $package.version
          rid = 'win-x64'
          fileName = 'dotcraft-unity-mcp.exe'
          sha256 = (Get-FileHash $executable -Algorithm SHA256).Hash.ToLowerInvariant()
        }
        $manifest | ConvertTo-Json | Set-Content 'artifacts/gateway/gateway-artifact.json' -Encoding utf8
        Copy-Item 'Tools~/McpGateway/THIRD-PARTY-NOTICES.txt' 'artifacts/gateway/THIRD-PARTY-NOTICES.txt'

    - name: Prepare Release Notes
      shell: pwsh
      run: |
        $version = $env:GITHUB_REF -replace '^refs/tags/', ''
        $repository = '${{ github.repository }}'
        if (Test-Path '.github/release_template.md') {
          $notes = Get-Content '.github/release_template.md' -Raw
          $notes = $notes.Replace('{{ VERSION }}', $version)
          $notes = $notes.Replace('{{ REPO }}', $repository)
          $notes = $notes.Replace('{{ CHANGELOG }}', '- See auto-generated notes below.')
          $notes | Set-Content 'release_notes.md' -Encoding utf8
        } else {
          "dotcraft-unity $version" | Set-Content 'release_notes.md' -Encoding utf8
        }

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        body_path: release_notes.md
        append_body: true
        draft: false
        prerelease: false
        generate_release_notes: true
        files: |
          artifacts/gateway/dotcraft-unity-mcp.exe
          artifacts/gateway/gateway-artifact.json
          artifacts/gateway/THIRD-PARTY-NOTICES.txt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
