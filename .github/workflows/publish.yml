name: Build and publish Unity
on:
  pull_request:
  push:
    branches: [master, main]
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build all deliverables
        shell: pwsh
        run: ./Tools/scripts/build.ps1 -OutputDirectory .artifacts/release
      - name: Verify plugin installation
        shell: pwsh
        run: ./Tools/scripts/test-plugin-host.ps1 -PluginRoot .artifacts/release/Unity
      - name: Test Gateway and Attach
        shell: pwsh
        run: |
          dotnet test Tools/tests/DotCraft.Unity.Cli.Tests/DotCraft.Unity.Cli.Tests.csproj -c Release
          if ($LASTEXITCODE) { throw 'Gateway tests failed.' }
          dotnet test Tools/tests/DotCraft.Unity.Attach.Tests/DotCraft.Unity.Attach.Tests.csproj -c Release
          if ($LASTEXITCODE) { throw 'Attach tests failed.' }
          ./Tools/tests/DotCraft.Unity.Cli.Tests/Install.Tests.ps1 -ArtifactDirectory .artifacts/release
      - uses: actions/upload-artifact@v4
        with:
          name: unity-release-candidate
          path: |
            .artifacts/release/
            !.artifacts/release/cli/**
            !.artifacts/release/upm/**
          include-hidden-files: true
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: windows-latest
    environment: unity-release
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: unity-release-candidate
          path: artifacts/release
      - name: Verify release candidate
        id: candidate
        shell: pwsh
        run: |
          ./Tools/scripts/verify-package.ps1 -ArtifactDirectory artifacts/release
          $manifest = Get-Content artifacts/release/release-manifest.json -Raw | ConvertFrom-Json
          if ($manifest.commit -cne '${{ github.sha }}' -or $manifest.sourceDirty -ne $false) { throw 'Release candidate must be a clean build of this commit.' }
          if ('v' + $manifest.version -cne '${{ github.ref_name }}') { throw 'Release tag must match package.json version.' }
          "version=$($manifest.version)" >> $env:GITHUB_OUTPUT
      - name: Prepare release notes
        shell: pwsh
        run: |
          $notes = Get-Content '.github/release_template.md' -Raw
          $notes = $notes.Replace('{{ VERSION }}', '${{ github.ref_name }}')
          $notes = $notes.Replace('{{ REPO }}', '${{ github.repository }}')
          $notes | Set-Content 'release_notes.md' -Encoding utf8
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          append_body: true
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/release/dotcraft-unity.exe
            artifacts/release/artifact.json
            artifacts/release/install.ps1
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.MARKETPLACE_APP_ID }}
          private-key: ${{ secrets.MARKETPLACE_APP_PRIVATE_KEY }}
          owner: DotHarness
          repositories: dotcraft-plugins
      - uses: actions/checkout@v6
        with:
          repository: DotHarness/dotcraft-plugins
          token: ${{ steps.app.outputs.token }}
          path: marketplace
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Stage complete official plugin
        shell: pwsh
        run: ./Tools/scripts/sync-marketplace.ps1 -ArtifactDirectory artifacts/release -MarketplaceRoot marketplace
      - uses: peter-evans/create-pull-request@v7
        with:
          path: marketplace
          token: ${{ steps.app.outputs.token }}
          branch: updates/unity-${{ steps.candidate.outputs.version }}
          commit-message: Update unity to ${{ steps.candidate.outputs.version }}
          title: Update unity to ${{ steps.candidate.outputs.version }}
          body: Complete Unity plugin binaries, skill and release provenance from the verified dotcraft-unity release. Maintainer review and merge are required.
          add-paths: |
            plugins/unity/**
            .craft/plugins/marketplace.json
